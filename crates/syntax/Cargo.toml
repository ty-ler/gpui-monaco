[package]
name = "gpui-monaco-syntax"
description = "Pluggable highlighting, tree-sitter backend and language registry for gpui-monaco."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "syntax"

[lints]
workspace = true

[dependencies]
gpui-monaco-text.workspace = true
fancy-regex = "0.18"
log = "0.4"
regex.workspace = true
serde.workspace = true
# Monarch grammars depend on key order (`cases`, the first state).
serde_json = { workspace = true, features = ["preserve_order"] }
streaming-iterator.workspace = true
tree-sitter.workspace = true

[dev-dependencies]
tree-sitter-rust = "0.24"
tree-sitter-md = "0.5"
proptest.workspace = true
