[package]
name = "gpui-monaco"
description = "A Monaco-like code editor component for GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["word-segmenter"]
# Monaco's `wordSegmenterLocales`: ICU4X word segmentation (with its compiled
# data) for word navigation, deletion and selection in languages like
# Japanese, Chinese and Thai. Without it the option has no effect.
word-segmenter = ["dep:icu_segmenter", "dep:icu_locale_core"]

[dependencies]
# `Instant` that works in browsers (std's on other targets).
web-time = "1"
anyhow.workspace = true
# `Shared` futures (an inlay hint resolves once for every caller).
futures = { version = "0.3", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
gpui.workspace = true
# The minimap's image (the version gpui uses).
image = { version = "0.25", default-features = false }
gpui-monaco-text.workspace = true
gpui-monaco-syntax.workspace = true
log = "0.4"
similar = "2"
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
uuid = { version = "1", features = ["v4"] }
icu_segmenter = { version = "2.3", optional = true }
icu_locale_core = { version = "2.3", optional = true, default-features = false }

[dev-dependencies]
async-channel = "2"
criterion.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui-monaco-languages.workspace = true

[[bench]]
name = "large_file"
harness = false
