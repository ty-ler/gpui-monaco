[workspace]
resolver = "3"
members = [
    "crates/text",
    "crates/syntax",
    "crates/gpui-monaco",
    "crates/gpui-monaco-languages",
    "crates/gpui-monaco-lsp",
    "examples/playground",
    "examples/with-gpui-component",
]
default-members = [
    "crates/text",
    "crates/syntax",
    "crates/gpui-monaco",
    "crates/gpui-monaco-languages",
    "crates/gpui-monaco-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ty-ler/gpui-monaco"
publish = true
homepage = "https://github.com/ty-ler/gpui-monaco"
keywords = ["gpui", "editor", "monaco", "code-editor", "text-editor"]
categories = ["gui", "text-editors"]

[workspace.dependencies]
gpui-monaco-text = { path = "crates/text", version = "0.1.0" }
gpui-monaco-syntax = { path = "crates/syntax", version = "0.1.0" }
gpui-monaco = { path = "crates/gpui-monaco", version = "0.1.0" }
gpui-monaco-languages = { path = "crates/gpui-monaco-languages", version = "0.1.0" }
gpui-monaco-lsp = { path = "crates/gpui-monaco-lsp", version = "0.1.0" }

# gpui from the `gpui-pre` crates.io snapshots of zed (0.3.8 is zed@279fe07),
# pinned exactly like gpui-component does, so apps can use both. Bump all
# three together; see CONTRIBUTING.md.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
sum_tree = { package = "gpui-pre-sum-tree", version = "=0.3.8" }

anyhow = "1.0"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.5"
rand = "0.9"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
tree-sitter = "0.27"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
unicode-segmentation = "1.12"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package.gpui-pre]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3
[profile.dev.package.gpui-monaco-text]
opt-level = 2
[profile.dev.package.gpui-pre-sum-tree]
opt-level = 2
[profile.dev.package.gpui-monaco-syntax]
opt-level = 2
[profile.dev.package.tree-sitter]
opt-level = 2
