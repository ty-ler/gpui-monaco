name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  docs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Rustdoc (missing_docs and broken links are errors)
        run: cargo doc --no-deps -p gpui-monaco -p gpui-monaco-text -p gpui-monaco-syntax -p gpui-monaco-languages -p gpui-monaco-lsp
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Guide
        run: |
          cargo install mdbook --locked --version 0.4.52
          mdbook build book

  # The large-file budget (docs/PERFORMANCE.md), doubled for shared runners.
  perf-budget:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p gpui-monaco --test perf_budget -- --ignored --nocapture
        env:
          PERF_BUDGET_SCALE: "2"
      - run: cargo bench -p gpui-monaco --bench large_file -- --quick

  # wasm32 (#58): the editor and its grammars compile for the web. Grammars use
  # script/wasm/cc (see .cargo/config.toml). Best-effort, like Linux and Windows.
  check-wasm:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown -p gpui-monaco -p gpui-monaco-languages

  # Linux and Windows are best-effort: they must build, but are not release blockers.
  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libglib2.0-dev libssl-dev \
            libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev clang
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
